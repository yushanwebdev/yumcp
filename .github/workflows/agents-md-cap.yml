name: AGENTS.md cap

# Runs from the base branch via pull_request_target, so a PR cannot raise the
# cap or remove the check for itself. It never checks out or runs PR code: it
# reads AGENTS.md through the API. A PR that edits this workflow fails and
# merges only past a red check, by a human. Adapted from kody-hq/kody.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  checks: write
  pull-requests: read

jobs:
  cap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check AGENTS.md line count
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CAP: 20
        run: |
          set -euo pipefail
          files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" \
            --jq '.[] | .filename, (.previous_filename // empty)')
          lines=0
          if grep -qx 'AGENTS.md' <<<"$files"; then
            lines=$(gh api "repos/$REPO/contents/AGENTS.md?ref=$HEAD_SHA" \
              -H 'Accept: application/vnd.github.raw' | wc -l)
          fi
          self=$(grep -cx '.github/workflows/agents-md-cap.yml' <<<"$files" || true)
          conclusion=success
          title="AGENTS.md: $lines/$CAP lines"
          [ "$lines" -eq 0 ] && title="AGENTS.md unchanged"
          summary="Keep AGENTS.md a pointer map; put detail in docs/."
          if [ "$lines" -gt "$CAP" ]; then
            conclusion=failure
            summary="AGENTS.md has $lines lines; the cap is $CAP. Move detail into docs/ and link it."
          fi
          if [ "$self" -gt 0 ]; then
            conclusion=failure
            title="This PR edits the AGENTS.md cap workflow"
            summary="Changes to this workflow merge only past a red check, by a human."
          fi
          gh api "repos/$REPO/check-runs" -X POST \
            -f name='AGENTS.md cap' -f head_sha="$HEAD_SHA" \
            -f status=completed -f conclusion="$conclusion" \
            -f "output[title]=$title" -f "output[summary]=$summary" >/dev/null

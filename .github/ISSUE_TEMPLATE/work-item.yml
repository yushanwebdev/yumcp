name: Work item
description: An intent-first unit of work for an agent or a human
title: ''
labels: [needs-triage]
body:
  - type: markdown
    attributes:
      value: >
        Not a spec. State the outcome and the one-way doors; the agent proposes
        the plan. A team member adds `agent-ready` after triage. Editing the
        body afterwards voids the label (decision F0022).
  - type: textarea
    id: intent
    attributes:
      label: Intent
      description: The user outcome, in one sentence.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: 2–4 behaviours a user or caller would notice.
    validations:
      required: true
  - type: textarea
    id: door
    attributes:
      label: Door
      description: Which parts are one-way (data model, public URLs or API, deletions). Everything else is two-way.
    validations:
      required: true
  - type: input
    id: bet
    attributes:
      label: Bet
      description: The bet this belongs to (docs/bets/BNNN), or "none (fix / internal)". Outcomes are measured per bet, not per item (decision F0024).
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: Tempting extras that stay out.
    validations:
      required: false
